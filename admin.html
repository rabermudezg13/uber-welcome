<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Passenger Welcome</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#080808;color:#fff;font-family:Arial,sans-serif}.panel{width:min(540px,100%);padding:26px;text-align:center;background:#161616;border:1px solid rgba(212,175,55,.5);border-radius:24px}h1{margin:0;color:#d4af37;font-size:34px}p,label{color:#bbb}label{display:block;text-align:left;margin-top:14px;font-weight:700}input,select,button{width:100%;margin:7px 0;padding:16px;border:0;border-radius:14px;font-size:22px}input,select{background:#fff;color:#111}button{background:#d4af37;color:#111;font-weight:900}.secondary{background:#333;color:#fff}.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.quick button{font-size:18px;margin:0}.status{min-height:24px;margin-top:14px;color:#d4af37;font-weight:700}</style></head><body><main class="panel"><h1>Passenger Welcome</h1><p>Enter the passenger's name and choose the greeting language.</p><label for="nameInput">Passenger name</label><input id="nameInput" placeholder="Passenger name" autocomplete="off" maxlength="40"><label for="language">Greeting language</label><select id="language"><option value="en">English</option><option value="es">Español</option><option value="de">Deutsch</option><option value="ru">Русский</option><option value="ar">العربية</option><option value="fr">Français</option><option value="it">Italiano</option></select><button id="sendBtn">Send to Tablet</button><button class="secondary" id="clearBtn">Clear Screen</button><div class="quick"><button data-name="Airport Guest">Airport</button><button data-name="Hotel Guest">Hotel</button><button data-name="VIP Guest">VIP</button><button data-name="">Blank</button></div><div class="status" id="status"></div></main><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import{getDatabase,ref,set,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";import{firebaseConfig}from"./firebase-config.js";const db=getDatabase(initializeApp(firebaseConfig)),input=document.getElementById("nameInput"),language=document.getElementById("language"),status=document.getElementById("status");async function send(name){const passengerName=String(name||"").trim();await set(ref(db,"ride"),{passengerName,language:language.value,updatedAt:serverTimestamp()});status.textContent=passengerName?`Sent: ${passengerName} (${language.options[language.selectedIndex].text})`:"Tablet cleared";setTimeout(()=>status.textContent="",2500)}document.getElementById("sendBtn").onclick=()=>send(input.value);document.getElementById("clearBtn").onclick=()=>{input.value="";send("")};input.onkeydown=e=>{if(e.key==="Enter")send(input.value)};document.querySelectorAll("[data-name]").forEach(b=>b.onclick=()=>{input.value=b.dataset.name;send(input.value)});</script></body></html>
