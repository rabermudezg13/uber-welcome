<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Driver Admin</title>
  <style>
    :root { --gold:#d4af37; --bg:#080808; --card:#161616; --text:#fff; --muted:#bbb; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .panel {
      width: min(540px, 100%);
      background: var(--card);
      border: 1px solid rgba(212,175,55,.5);
      border-radius: 24px;
      padding: 26px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,.55);
    }
    h1 { color: var(--gold); margin: 0 0 8px; font-size: 34px; }
    p { color: var(--muted); margin-top: 0; }
    input, button {
      width: 100%;
      font-size: 25px;
      padding: 16px;
      border-radius: 14px;
      border: none;
      margin: 9px 0;
    }
    input { background: #fff; color: #111; }
    button {
      background: var(--gold);
      color: #111;
      font-weight: 900;
    }
    button.secondary { background: #333; color: #fff; }
    .quick {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }
    .quick button { font-size: 18px; padding: 13px 8px; margin: 0; }
    .status { min-height: 24px; margin-top: 14px; color: var(--gold); font-weight: 700; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Passenger Welcome</h1>
    <p>Write the passenger name and send it to the tablet.</p>
    <input id="nameInput" placeholder="Passenger name" autocomplete="off" />
    <button id="sendBtn">Send to Tablet</button>
    <button class="secondary" id="clearBtn">Clear Screen</button>

    <div class="quick">
      <button data-name="Airport Guest">Airport</button>
      <button data-name="Hotel Guest">Hotel</button>
      <button data-name="VIP Guest">VIP</button>
      <button data-name="">Blank</button>
    </div>
    <div class="status" id="status"></div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
    import { firebaseConfig } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const nameInput = document.getElementById("nameInput");
    const status = document.getElementById("status");

    async function sendName(name) {
      const cleanName = String(name || "").trim();
      await set(ref(db, "ride/passengerName"), cleanName);
      status.textContent = cleanName ? `Sent: ${cleanName}` : "Tablet cleared";
      setTimeout(() => status.textContent = "", 2500);
    }

    document.getElementById("sendBtn").addEventListener("click", () => sendName(nameInput.value));
    document.getElementById("clearBtn").addEventListener("click", () => { nameInput.value = ""; sendName(""); });
    nameInput.addEventListener("keydown", (e) => { if (e.key === "Enter") sendName(nameInput.value); });
    document.querySelectorAll(".quick button").forEach(btn => {
      btn.addEventListener("click", () => {
        const value = btn.dataset.name;
        nameInput.value = value;
        sendName(value);
      });
    });
  </script>
</body>
</html>
