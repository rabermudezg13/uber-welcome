<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Passenger Welcome</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#080808;color:#fff;font-family:Arial,sans-serif}.panel{width:min(540px,100%);padding:26px;text-align:center;background:#161616;border:1px solid rgba(212,175,55,.5);border-radius:24px}h1{margin:0;color:#d4af37;font-size:34px}p,label{color:#bbb}label{display:block;text-align:left;margin-top:14px;font-weight:700}input,select,button{width:100%;margin:7px 0;padding:16px;border:0;border-radius:14px;font-size:22px}input,select{background:#fff;color:#111}button{background:#d4af37;color:#111;font-weight:900;cursor:pointer}.secondary{background:#333;color:#fff}.reset{background:#8f2222;color:#fff}.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.quick button{font-size:18px;margin:0}.status{min-height:24px;margin-top:14px;color:#d4af37;font-weight:700}</style></head><body><main class="panel"><h1>Passenger Welcome</h1><p>Set the passenger welcome screen on the iPad.</p><label for="nameInput">Passenger name</label><input id="nameInput" placeholder="Passenger name" autocomplete="off" maxlength="40"><label for="language">Greeting language</label><select id="language"><option value="en">English</option><option value="es">Español</option><option value="pt">Português</option><option value="de">Deutsch</option><option value="ru">Русский</option><option value="ar">العربية</option><option value="fr">Français</option><option value="it">Italiano</option></select><label for="etaInput">Estimated ride time (minutes)</label><input id="etaInput" type="number" min="1" max="999" inputmode="numeric" placeholder="Example: 35"><button id="sendBtn">Send to iPad</button><button class="reset" id="resetBtn">Reset for Next Passenger</button><div class="quick"><button data-name="Airport Guest">Airport</button><button data-name="Hotel Guest">Hotel</button><button data-name="VIP Guest">VIP</button><button data-name="">Blank</button></div><div class="status" id="status"></div></main><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import{getDatabase,ref,set,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";import{firebaseConfig}from"./firebase-config.js";const db=getDatabase(initializeApp(firebaseConfig)),input=document.getElementById("nameInput"),language=document.getElementById("language"),eta=document.getElementById("etaInput"),status=document.getElementById("status");async function send(name){const passengerName=String(name||"").trim(),estimatedMinutes=eta.value?Math.max(1,parseInt(eta.value,10)||0):null;await set(ref(db,"ride"),{passengerName,language:language.value,estimatedMinutes,updatedAt:serverTimestamp()});status.textContent=passengerName?`Sent: ${passengerName}${estimatedMinutes?` · ${estimatedMinutes} min`:""}`:"Welcome screen ready";setTimeout(()=>status.textContent="",2500)}document.getElementById("sendBtn").onclick=()=>send(input.value);document.getElementById("resetBtn").onclick=async()=>{input.value="";eta.value="";language.value="en";await set(ref(db,"ride"),{passengerName:"",language:"en",estimatedMinutes:null,updatedAt:serverTimestamp()});status.textContent="Reset complete — ready for next passenger";setTimeout(()=>status.textContent="",3000)};input.onkeydown=e=>{if(e.key==="Enter")send(input.value)};document.querySelectorAll("[data-name]").forEach(b=>b.onclick=()=>{input.value=b.dataset.name;send(input.value)});</script></body></html>
