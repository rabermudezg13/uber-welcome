<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Welcome Aboard</title><style>
:root{--gold:#d4af37}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:25px;background:radial-gradient(circle at top,rgba(212,175,55,.2),transparent 40%),linear-gradient(135deg,#000,#111,#000);color:#fff;font-family:Arial,sans-serif}.card{width:min(1100px,100%);padding:36px;text-align:center;background:rgba(255,255,255,.07);border:1px solid rgba(212,175,55,.5);border-radius:30px}.badge{display:inline-block;padding:10px 22px;background:var(--gold);color:#111;border-radius:99px;font-weight:900}h1{margin:18px 0 10px;color:var(--gold);font-size:clamp(46px,7vw,86px);overflow-wrap:anywhere}.day{font-size:clamp(25px,4vw,44px);font-weight:900;margin:0 0 14px}.eta{display:none;margin:0 auto 20px;width:max-content;max-width:100%;padding:10px 20px;border:1px solid rgba(212,175,55,.55);border-radius:99px;font-size:clamp(19px,2.5vw,28px);font-weight:800;color:#f3d66f}.message{font-size:clamp(19px,2.7vw,31px);line-height:1.4}.amenities{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:24px}.amenity,.section{padding:17px;border:1px solid rgba(255,255,255,.15);border-radius:18px;background:rgba(255,255,255,.05);font-size:22px;font-weight:700}.section{margin-top:18px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:13px}.button{display:flex;align-items:center;justify-content:center;min-height:58px;padding:13px 14px;border-radius:15px;text-decoration:none;font-weight:900;font-size:19px;color:#fff;background:#242424;border:1px solid rgba(255,255,255,.16)}.spotify{background:#1db954;color:#07150c}.hulu{background:#1ce783;color:#07150c}.disney{background:#173ea5}.prime{background:#1399d6}.footer{margin-top:20px;font-size:20px;color:#ddd}[dir=rtl] .card{direction:rtl}@media(max-width:760px){.amenities{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}.card{padding:24px}}@media(max-width:430px){.actions{grid-template-columns:1fr}}</style></head><body>
<main class="card"><div class="badge" id="timeGreeting"></div><h1 id="welcomeTitle"></h1><div class="day" id="excellentDay"></div><div class="eta" id="eta"></div><div class="message" id="mainMessage"></div><div class="amenities"><div class="amenity" id="drinks"></div><div class="amenity" id="snacks"></div><div class="amenity" id="charging"></div></div><div class="section"><div id="entertainmentPrompt"></div><div class="actions"><a id="spotifyApp" href="https://open.spotify.com" class="button spotify" target="_blank" rel="noopener">🎧 Spotify</a><a href="https://www.hulu.com/hub/home" class="button hulu" target="_blank" rel="noopener">Hulu</a><a href="https://www.disneyplus.com/" class="button disney" target="_blank" rel="noopener">Disney+</a><a href="https://www.amazon.com/gp/video/storefront" class="button prime" target="_blank" rel="noopener">Prime Video</a></div></div><div class="footer" id="footer"></div></main>

const $=id=>document.getElementById(id);function render(v={}){const lang=tr[v.language]?v.language:"en",t=tr[lang],name=String(v.passengerName||"").trim(),minutes=parseInt(v.estimatedMinutes,10),h=new Date().getHours(),gi=h<12?0:h<18?1:2;document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";$("timeGreeting").textContent=t.g[gi];$("welcomeTitle").textContent=name?`${t.hi}, ${name}!`:t.welcome;$("excellentDay").textContent=t.day;const eta=$("eta");if(Number.isFinite(minutes)&&minutes>0){eta.textContent=`⏱ ${t.eta}: ${minutes} ${t.min}`;eta.style.display="block"}else{eta.textContent="";eta.style.display="none"}$("mainMessage").textContent=t.msg;$("drinks").textContent=t.d;$("snacks").textContent=t.s;$("charging").textContent=t.c;$("entertainmentPrompt").textContent=t.e;$("footer").textContent=t.f}render();onValue(ref(getDatabase(initializeApp(firebaseConfig)),"ride"),s=>{const v=s.val()||{};render(typeof v==="string"?{passengerName:v}:v)});</script></body></html>
