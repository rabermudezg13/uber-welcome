<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Welcome Aboard</title><style>
:root{--gold:#d4af37}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:25px;background:radial-gradient(circle at top,rgba(212,175,55,.2),transparent 40%),linear-gradient(135deg,#000,#111,#000);color:#fff;font-family:Arial,sans-serif}.card{width:min(1100px,100%);padding:40px;text-align:center;background:rgba(255,255,255,.07);border:1px solid rgba(212,175,55,.5);border-radius:30px}.badge{display:inline-block;padding:10px 22px;background:var(--gold);color:#111;border-radius:99px;font-weight:900}h1{margin:18px 0 10px;color:var(--gold);font-size:clamp(48px,7vw,90px);overflow-wrap:anywhere}.day{font-size:clamp(28px,4vw,48px);font-weight:900;margin:0 0 20px}.message{font-size:clamp(20px,3vw,34px);line-height:1.4}.amenities{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:30px}.amenity,.music{padding:20px;border:1px solid rgba(255,255,255,.15);border-radius:18px;background:rgba(255,255,255,.05);font-size:24px;font-weight:700}.music{margin-top:30px}.button{display:inline-block;margin:15px 5px 0;padding:16px 25px;border-radius:99px;text-decoration:none;font-weight:900;font-size:24px;color:#fff;background:#1db954}.secondary{background:#333}.qr{display:block;width:220px;max-width:100%;margin:20px auto 0;padding:8px;background:#fff;border-radius:15px}.footer{margin-top:25px;font-size:22px;color:#ddd}[dir=rtl] .card{direction:rtl}@media(max-width:700px){.amenities{grid-template-columns:1fr}}</style></head><body>
<main class="card"><div class="badge" id="timeGreeting"></div><h1 id="welcomeTitle"></h1><div class="day" id="excellentDay"></div><div class="message" id="mainMessage"></div><div class="amenities"><div class="amenity" id="drinks"></div><div class="amenity" id="snacks"></div><div class="amenity" id="charging"></div></div><div class="music"><div id="musicPrompt"></div><a id="spotifyLink" class="button" target="_blank" rel="noopener"></a><a id="spotifyApp" href="https://open.spotify.com" class="button secondary" target="_blank" rel="noopener"></a><img src="assets/spotify-jam-qr.jpg" class="qr" alt="Spotify QR"></div><div class="footer" id="footer"></div></main>
<script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import{getDatabase,ref,onValue}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";import{firebaseConfig,SPOTIFY_JAM_LINK}from"./firebase-config.js";

const $=id=>document.getElementById(id);$("spotifyLink").href=SPOTIFY_JAM_LINK;function render(v={}){const lang=tr[v.language]?v.language:"en",t=tr[lang],name=String(v.passengerName||"").trim(),h=new Date().getHours(),gi=h<12?0:h<18?1:2;document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";$("timeGreeting").textContent=t.g[gi];$("welcomeTitle").textContent=name?`${t.hi}, ${name}!`:t.welcome;$("excellentDay").textContent=t.day;$("mainMessage").textContent=t.msg;$("drinks").textContent=t.d;$("snacks").textContent=t.s;$("charging").textContent=t.c;$("musicPrompt").textContent=t.m;$("spotifyLink").textContent=t.j;$("spotifyApp").textContent=t.o;$("footer").textContent=t.f}render();onValue(ref(getDatabase(initializeApp(firebaseConfig)),"ride"),s=>{const v=s.val()||{};render(typeof v==="string"?{passengerName:v}:v)});</script></body></html>
