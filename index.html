```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome Aboard</title>

<style>
:root{
  --gold:#d4af37;
  --green:#1DB954;
  --text:#ffffff;
  --glass:rgba(255,255,255,.07);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:25px;
  background:
    radial-gradient(circle at top,
      rgba(212,175,55,.20),
      transparent 40%),
    linear-gradient(135deg,#000,#111,#000);
  color:white;
  font-family:Arial, Helvetica, sans-serif;
}

.card{
  width:min(1100px,100%);
  background:var(--glass);
  border:1px solid rgba(212,175,55,.5);
  border-radius:30px;
  padding:40px;
  text-align:center;
  backdrop-filter:blur(12px);
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}

.badge{
  display:inline-block;
  background:var(--gold);
  color:#111;
  padding:10px 22px;
  border-radius:999px;
  font-weight:900;
  margin-bottom:20px;
}

h1{
  color:var(--gold);
  font-size:clamp(48px,7vw,90px);
  margin-bottom:15px;
}

.message{
  font-size:clamp(22px,3vw,36px);
  line-height:1.4;
  max-width:900px;
  margin:auto;
}

.amenities{
  margin-top:30px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.amenity{
  padding:20px;
  border-radius:18px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.12);
  font-size:24px;
  font-weight:700;
}

.music{
  margin-top:35px;
  display:grid;
  grid-template-columns:1fr 250px;
  gap:25px;
  align-items:center;
}

.music-box{
  border:1px solid rgba(29,185,84,.4);
  background:rgba(29,185,84,.08);
  padding:25px;
  border-radius:25px;
}

.button{
  display:inline-block;
  margin-top:15px;
  padding:18px 30px;
  border-radius:999px;
  text-decoration:none;
  font-weight:900;
  font-size:28px;
}

.spotify{
  background:#1DB954;
  color:white;
}

.spotify-app{
  background:#333;
  color:white;
}

.qr{
  width:100%;
  background:white;
  border-radius:18px;
  padding:10px;
}

.footer{
  margin-top:25px;
  color:#ddd;
  font-size:22px;
}

@media(max-width:768px){

  .amenities{
    grid-template-columns:1fr;
  }

  .music{
    grid-template-columns:1fr;
  }

  .qr{
    max-width:250px;
    margin:auto;
  }
}
</style>
</head>

<body>

<div class="card">

  <div id="timeGreeting" class="badge">
    Welcome
  </div>

  <h1 id="welcomeTitle">
    Welcome aboard!
  </h1>

  <div class="message" id="mainMessage">
    Thanks for joining the ride with me. I'm Rodrigo.
  </div>

  <div class="amenities">
    <div class="amenity">🥤 Cold Drinks</div>
    <div class="amenity">🍪 Complimentary Snacks</div>
    <div class="amenity">🔌 Charging Cables Available</div>
  </div>

  <div class="music">

    <div class="music-box">

      <div class="message" style="font-size:28px;">
        Choose your favorite music
      </div>

      <a
        id="spotifyLink"
        class="button spotify"
        target="_blank">
        🎵 Join Spotify Jam
      </a>

      <br>

      <a
        href="https://open.spotify.com"
        class="button spotify-app"
        target="_blank">
        🎧 Open Spotify App
      </a>

    </div>

    <img
      src="assets/spotify-jam-qr.jpg"
      class="qr"
      alt="Spotify QR">

  </div>

  <div class="footer">
    Have a wonderful ride.
  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

import {
  firebaseConfig,
  SPOTIFY_JAM_LINK
}
from "./firebase-config.js";

document.getElementById("spotifyLink").href =
  SPOTIFY_JAM_LINK;

function getGreeting(){

  const hour = new Date().getHours();

  if(hour < 12) return "Good Morning";

  if(hour < 18) return "Good Afternoon";

  return "Good Evening";
}

function render(name){

  document.getElementById("timeGreeting")
    .textContent = getGreeting();

  if(name){

    document.getElementById("welcomeTitle")
      .textContent =
      `Hi, ${name}!`;

  }else{

    document.getElementById("welcomeTitle")
      .textContent =
      "Welcome aboard!";
  }

  document.getElementById("mainMessage")
    .textContent =
    "Thanks for joining the ride with me. I'm Rodrigo. Please feel free to enjoy the Spotify Jam, choose your favorite music, grab a cold drink from the cooler, and enjoy the snacks.";
}

render("");

const app =
  initializeApp(firebaseConfig);

const db =
  getDatabase(app);

const passengerRef =
  ref(db,"ride/passengerName");

onValue(passengerRef,(snapshot)=>{

  const name =
    snapshot.val();

  render(name);
});

</script>

</body>
</html>
```
